<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Brighter Atlas: the Obelisk (arches on plinths, gold caps and spires) guarding a bold A, in vivid gold and the
       app's blue, each lit from the top (the "Vivid" look, 2026-10-01) -->
  <defs>
    <clipPath id="l"><rect width="16" height="32"/></clipPath>
    <clipPath id="r"><rect x="16" width="16" height="32"/></clipPath>
    <path id="a" fill-rule="evenodd" d="M16 14.4 20.9 25.8H18L17.2 23.4H14.8L14 25.8H11.1ZM16 18.4 15.2 21.3H16.8Z"/>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe39a"/><stop offset=".55" stop-color="#f0b742"/><stop offset="1" stop-color="#c98a1c"/></linearGradient>
    <linearGradient id="plinth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d39a2c"/><stop offset="1" stop-color="#9c6a14"/></linearGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#f5c64f"/></linearGradient>
    <linearGradient id="aLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#3b8cff"/></linearGradient>
    <linearGradient id="aRight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8dff"/><stop offset="1" stop-color="#1f55d6"/></linearGradient>
  </defs>
  <g fill="none" stroke="url(#arch)" stroke-width="2.6">
    <path d="M8 27C8 18.5 10.4 14 14 12.8"/>
    <path d="M24 27C24 18.5 21.6 14 18 12.8"/>
  </g>
  <g fill="url(#plinth)">
    <rect x="5" y="26.4" width="6" height="4.2" rx=".5"/>
    <rect x="21" y="26.4" width="6" height="4.2" rx=".5"/>
  </g>
  <g fill="#ffd76a">
    <rect x="12.4" y="11.2" width="3.2" height="3" rx=".4"/>
    <rect x="16.4" y="11.2" width="3.2" height="3" rx=".4"/>
  </g>
  <g fill="url(#spire)">
    <path d="M13.2 11.4 14.6 1.2 15.4 11.4Z"/>
    <path d="M16.6 11.4 17.4 1.2 18.8 11.4Z"/>
  </g>
  <use href="#a" fill="url(#aLeft)" clip-path="url(#l)"/>
  <use href="#a" fill="url(#aRight)" clip-path="url(#r)"/>
</svg>
