<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brighter Fashion</title>
<meta name="description" content="Design a Brighter Shores character and try on every weapon, shield, armour piece and cosmetic in every tier and dye, then save the look, share it or take a picture. A fan-made tool, nothing to install.">
<meta name="theme-color" content="#12151b">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Brighter Fashion">

</head>

        <span class="brand-name">Brighter</span>
        <span class="brand-sub">fashion</span>
      </a>
      <span id="game-build" class="of-gamebuild mono of-exp" title="The game update these clothes and faces come from"></span>
    </div>
    <div class="top-right">
      <a class="btn-mini top-social discord" href="https://discord.gg/XQeGGaBexH" target="_blank" rel="noopener noreferrer" title="Join the Brighter Atlas Discord">

  </header>
  <div id="of-toolbar" class="of-toolbar" hidden>
    <button id="undo" class="btn-mini of-icon" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4V2M4 7a9 9 0 1 1-1.5 9"/></svg></button>
    <button id="redo" class="btn-mini of-icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7h5V2M20 7a9 9 0 1 0 1.5 9"/></svg></button>
    <button id="shot" class="btn-mini of-icon-sm" title="Save the view as a picture" aria-label="Save picture"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg><span>Save picture</span></button>
    <button id="share" class="btn-mini of-share" title="Your looks: save this one, wear a saved one, share a link" aria-haspopup="dialog"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Looks</span></button>
  </div>
  <main></main>
  <div class="of-rotate" role="alert"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><b>Turn your phone upright</b><span>Brighter Fashion is made for holding your phone this way up.</span></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="js/fashion.js"></script>

</html>
