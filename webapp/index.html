<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brighter Atlas</title>
<meta name="description" content="Fan-made tools for Brighter Shores: try on every outfit and dye, the world map for every game update, and everything in your own game files.">
<meta name="theme-color" content="#12151b">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Brighter Atlas">
<meta property="og:description" content="Fan-made tools for Brighter Shores: Brighter Fashion, Brighter Maps and Brighter Data.">
<meta property="og:url" content="https://brighteratlas.com/">
<meta name="twitter:card" content="summary">
<!-- the interface symbols' font (css/app.css), ready before the first paint so no symbol is drawn as a box -->
<link rel="preload" href="/vendor/fonts/ui-symbols.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/vendor/fonts/ui-symbols2.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/vendor/fonts/ui-math.woff2" as="font" type="font/woff2" crossorigin>
<!-- "Brighter" in the brand's face (css/app.css), for the top bar's first paint -->
<link rel="preload" href="/vendor/fonts/brighter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<!-- the landing page's own (all under .home), in before the first paint so it never draws unstyled; the tools'
     sheets come with their code, their pages hidden until they are in -->
<link rel="stylesheet" href="/css/home.css">
<!-- icons: all derived from brand/mark.svg by tools/icons.ts (npm run icons): the SVG favicon, a PNG one for
     browsers without SVG favicons, the home-screen icon iOS asks for (it reads no manifest for it), and the
     installed app's manifest (favicon.ico at the root is one more, found without a link) -->
<link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/brand/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Brighter Atlas">
</head>
<body>
<div id="root"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
