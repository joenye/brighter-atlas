<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Brighter Maps</title>
<meta name="description" content="The Brighter Shores world map for every game update. Slide through the dates to watch the world change. No game files needed.">
<meta name="theme-color" content="#12151b">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Brighter Maps">
<meta property="og:url" content="https://maps.brighteratlas.com/">
<meta property="og:description" content="The Brighter Shores world map for every game update. Slide through the dates to watch the world change.">
<meta name="twitter:card" content="summary">
<!-- the app's own look (css/app.css); css/world.css only lays this page out -->
<link rel="preload" href="vendor/fonts/ui-symbols.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/fonts/ui-symbols2.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/world.css">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="world" class="world">
  <header id="topbar">
    <div class="brand">
      <a class="brand-link" data-tool="maps" href="maps" title="Brighter Maps">
        <img class="brand-mark" src="brand/mark.svg" alt="" width="18" height="18">
        <span class="brand-name">Brighter</span>
        <span class="brand-sub">maps</span>
      </a>
    </div>
  </header>
  <div class="map-toolbar world-toolbar">
    <div class="world-pick">
      <button id="world-prev" class="btn" type="button" aria-label="Previous update" title="Previous update">&lsaquo;</button>
      <button id="world-release" class="btn world-release" type="button" aria-haspopup="dialog" aria-controls="world-picker" title="Choose a game update">Loading...</button>
      <button id="world-next" class="btn" type="button" aria-label="Next update" title="Next update">&rsaquo;</button>
    </div>
    <div class="world-slider">
      <div id="world-ticks" class="world-ticks" aria-hidden="true"></div>
      <input id="world-date" type="range" min="0" max="1" step="1" value="1" aria-label="Game update date">
      <div id="world-bubble" class="world-bubble" aria-hidden="true"></div>
    </div>
  </div>
  <div class="map-canvas-host world-map"><canvas id="world-satellite" class="world-satellite" aria-hidden="true"></canvas><canvas id="world-canvas" tabindex="0" aria-label="World map. Drag to pan, pinch or scroll to zoom."></canvas><canvas id="world-fog" class="world-fog" aria-hidden="true"></canvas><div id="world-sealed" class="world-sealed"></div>
    <div class="wmap-corner">
      <button id="world-view" class="wmap-view" type="button" aria-pressed="false" title="Show satellite pictures" hidden><canvas id="world-view-thumb" class="wmap-thumb" aria-hidden="true"></canvas><span id="world-view-name">Satellite</span></button>
      <label class="wmap-labels" title="Show room labels"><input id="world-labels" type="checkbox" checked><span>Labels</span></label>
      <label id="world-roofs-switch" class="wmap-labels" title="Show roofs (off: see inside the buildings)" hidden><input id="world-roofs" type="checkbox" checked><span>Roofs</span></label>
    </div>
    <div class="wmap-zoom" role="group" aria-label="Zoom">
      <button id="world-zoom-in" type="button" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
      <button id="world-zoom-out" type="button" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
    </div>
    <p id="world-note" class="world-note" role="status"></p>
    <div id="world-loading" class="load-card spin" role="status" hidden><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="pl-track" cx="22" cy="22" r="19"/><circle class="pl-fill" cx="22" cy="22" r="19"/></svg><span id="world-loading-text" class="pl-name">Loading</span><span class="pl-pct"></span></div>
    <p id="world-status" class="world-status" role="status"></p></div>
  <div id="world-picker" class="world-picker" role="dialog" aria-modal="true" aria-label="Choose a game update" hidden>
    <div class="world-picker-card">
      <div class="world-picker-head">
        <input id="world-search" type="search" placeholder="Search updates, for example 0.99 or Sep 2026" aria-label="Search game updates" autocomplete="off">
        <button id="world-picker-close" class="btn" type="button" aria-label="Close">&times;</button>
      </div>
      <ul id="world-list" class="world-list"></ul>
    </div>
  </div>
</div>
<script type="module" src="js/world.js"></script>
</body>
</html>
